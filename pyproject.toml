[project]
name = "ai-web-generator"
version = "0.1.0"
description = "Generator for AI web pages."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "aioboto3>=15.5.0",
    "aiohttp>=3.14.5",
    "editorconfig-checker==3.2.1",
    "fastapi[standard]==0.115.12",
    "furl>=2.1.4",
    "html-page-generator",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.16.3",
]

[tool.poe.tasks]
lint = "ruff check ./src"
format = "ruff format ./src"
run = "fastapi dev src/main.py"
pre = "pre-commit run --all-files"


[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pre-commit>=4.3.0",
    "ruff==0.11.13",
    "mypy>=2.4.1",
    "types-aioboto3[essential]>=15.5.0",
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_unused_configs = true
strict = true
ignore_missing_imports = true

[tool.uv.sources]
html-page-generator = { git = "https://github.com/devmanorg/html-page-generator.git" }
