[project]
name = "ai-web-generator"
version = "0.1.0"
description = "Generator for AI web pages."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "editorconfig-checker==3.2.1",
    "fastapi[standard]==0.115.12",

]

[tool.poe.tasks]
lint = "ruff check ./src"
format = "ruff format ./src"
run = "fastapi dev scr/main.py"
pre = "pre-commit run --all-files"


[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pre-commit>=4.3.0",
    "ruff==0.11.13",
]
